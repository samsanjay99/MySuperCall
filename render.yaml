# Render.com deployment configuration
# https://render.com/docs/deploy-web-services

services:
  - type: web
    name: mycall
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase (required for Phase 0+1 auth + permanent call IDs)
      # - SUPABASE_URL: your project URL (https://xxx.supabase.co)
      # - SUPABASE_ANON_KEY: the public anon key (safe for browser)
      # - SUPABASE_SERVICE_ROLE_KEY: the service_role key (SERVER ONLY - never in client code, HTML, or chat)
      #
      # SECURITY: If any Supabase credential (DB password, service key, etc.) was ever exposed in chat/source,
      # ROTATE IT IMMEDIATELY in the Supabase dashboard before deploying or testing.
      # All secrets must come exclusively from environment variables. Never hardcode.
    autoDeploy: true
    # Free tier note: service sleeps after 15 minutes of inactivity.
    # First request after sleep takes ~20-30 seconds to wake up.
    # WebRTC + Socket.IO works fine once awake.